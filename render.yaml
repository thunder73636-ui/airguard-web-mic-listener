services:
  - type: web
    name: airguard-web-mic-listener
    runtime: python
    plan: free
    rootDir: django_mic_web
    buildCommand: bash build.sh
    startCommand: python -m gunicorn config.wsgi:application --bind 0.0.0.0:$PORT
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_ALLOWED_HOSTS
        value: ".onrender.com,localhost"
      - key: FIREBASE_PROJECT_ID
        value: security2com
      - key: FIREBASE_API_KEY
        sync: false
      - key: WEBRTC_ICE_SERVERS
        sync: false
